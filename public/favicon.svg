<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square: Chambray #38598a with subtle gradient to #293e5e -->
  <rect width="32" height="32" rx="8" fill="#38598A"/>
  
  <rect width="32" height="32" rx="8" fill="url(#chambrayGrad)"/>
  <defs>
    <linearGradient id="chambrayGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C78A8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#26364F" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Open book left page: clean crisp white -->
  <path d="M6 10C6 9.44772 6.44772 9 7 9H15V23H7C6.44772 23 6 22.5523 6 22V10Z" fill="white" opacity="0.95"/>

  <!-- Open book right page: soft pigeon post tint #a7c4d7 -->
  <path d="M17 9H25C25.5523 9 26 9.44772 26 10V22C26 22.5523 25.5523 23 25 23H17V9Z" fill="#E9F1F5" opacity="0.95"/>

  <!-- Book spine / divider -->
  <rect x="15" y="9" width="2" height="14" fill="#38598A" opacity="0.5"/>

  <!-- Lines on left page: Chambray -->
  <rect x="8" y="13" width="5" height="1.5" rx="0.75" fill="#38598A" opacity="0.45"/>
  <rect x="8" y="16" width="5" height="1.5" rx="0.75" fill="#38598A" opacity="0.45"/>
  <rect x="8" y="19" width="3.5" height="1.5" rx="0.75" fill="#38598A" opacity="0.45"/>

  <!-- Lines on right page: Bermuda Gray #718da2 -->
  <rect x="19" y="13" width="5" height="1.5" rx="0.75" fill="#718DA2" opacity="0.4"/>
  <rect x="19" y="16" width="5" height="1.5" rx="0.75" fill="#718DA2" opacity="0.4"/>
  <rect x="19" y="19" width="3.5" height="1.5" rx="0.75" fill="#718DA2" opacity="0.4"/>

  <!-- Academic spark accent: Ronchi gold #f0c74c -->
  <circle cx="26" cy="6" r="3.5" fill="#F0C74C"/>
  <path d="M26 4L26.6 5.4L28 6L26.6 6.6L26 8L25.4 6.6L24 6L25.4 5.4L26 4Z" fill="#38598A"/>
</svg>
